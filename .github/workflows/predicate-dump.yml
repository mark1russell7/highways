# The dump of the near inputs of the geometric predicates (PREDICATE-CASES), for the exact predicates of the algebra role.
# Each job runs `packages/core/scripts/predicate-dump.ts` on one board set. It writes one gzip file of JSON lines and a Markdown summary.
# The artifact `predicate-dump-<set>` keeps the two files for 30 days. The script header tells the format of the lines.
name: Predicate dump

on:
  workflow_dispatch:
    inputs:
      sets:
        description: "The board sets to dump, with commas between them, or all. The sets are screen-v1, screen-v2, screen-v3, exact-v1, exact-v1-bounds, fixtures, fixtures-large and dense-board."
        default: "all"

permissions:
  contents: read

concurrency:
  # One run for each workflow and ref (RUNNER-SLOTS). A new dispatch waits for the run before it.
  group: predicate-dump-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          SETS: ${{ inputs.sets }}
        # The limit of each set is an estimate from the dump of exact-v1: 40 boards and 7 steps in 66 s on a local machine.
        # The time of a board grows faster than its count of boxes, and the sink adds the cost of each test. So the limits keep a large margin.
        # The script starts no more boards 25 min before the limit, so the upload gets the boards that the job dumped.
        # The node of the runner image builds the matrix. A set that is not in the list fails the job.
        run: |
          node -e '
            const all = { "exact-v1": 30, "exact-v1-bounds": 90, "screen-v1": 90, "screen-v2": 240, "screen-v3": 345, "fixtures": 345, "fixtures-large": 345, "dense-board": 240 };
            const sets = (process.env.SETS ?? "").trim();
            const want = sets === "" || sets === "all" ? Object.keys(all) : sets.split(",").map((s) => s.trim()).filter((s) => s.length > 0);
            const unknown = want.filter((s) => !(s in all));
            if (unknown.length > 0) { console.log(`::error::There is no board set ${unknown.join(", ")}.`); process.exit(1); }
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(want.map((set) => ({ set, minutes: all[set] })))}\n`);
          '

  dump:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories, and heavy work keeps 28 of them at most. So a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SET: ${{ matrix.set }}
      MINUTES: ${{ matrix.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dump the near inputs of the predicates on the boards of the set
        working-directory: packages/core
        run: |
          # The script exits with the code 1 at its deadline. The summary gets the counts before the step fails.
          status=0
          node scripts/predicate-dump.ts --set "$SET" --out "$GITHUB_WORKSPACE/out/predicate-dump-$SET.jsonl.gz" --summary "$GITHUB_WORKSPACE/out/predicate-dump-$SET.md" --deadline-minutes "$((MINUTES - 25))" || status=$?
          [ -f "$GITHUB_WORKSPACE/out/predicate-dump-$SET.md" ] && cat "$GITHUB_WORKSPACE/out/predicate-dump-$SET.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: predicate-dump-${{ matrix.set }}
          path: out/predicate-dump-*
          retention-days: 30
          # The file of the lines has gzip already.
          compression-level: 0
          if-no-files-found: warn
