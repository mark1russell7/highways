# The benchmark of the routers. It routes each fixture up to `max` nodes with each router,
# writes the table to the summary of the run and keeps the raw rows (bench.json) as an artifact.
# The large fixtures run only here, not on a local machine.
name: Bench

on:
  push:
    branches: [main]
    paths: ["packages/core/**", ".github/workflows/bench.yml"]
  workflow_dispatch:
    inputs:
      max:
        description: "The largest fixture, in nodes"
        default: "100000"
      repeat:
        description: "The runs of each cell (the time is the median)"
        default: "3"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX: ${{ inputs.max || '100000' }}
      REPEAT: ${{ inputs.repeat || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the benchmark
        run: |
          set -o pipefail
          pnpm --filter @mark1russell7/highways bench --max "$MAX" --repeat "$REPEAT" --json "$GITHUB_WORKSPACE/bench.json" | tee table.txt
          { echo "## Bench (max $MAX nodes, $REPEAT runs)"; echo; echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.json
          if-no-files-found: warn
