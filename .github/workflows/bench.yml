# The benchmark of the routers. The large fixtures run only here, not on a local machine.
# The job `plan` divides the benchmark into parts. Each job of the matrix `part` routes some fixtures with some routers.
# The job `join` joins the rows of the parts into one table and one bench.json, in the format of one run.
# A push to main runs the fixtures up to 10 000 nodes. The nightly run and a run with `max` 100000 also run the fixture of 100 000 nodes.
# Each cell has a time limit. After the routes of a cell pass the limit, the cell starts no more routes, and its row shows "over the limit".
name: Bench

on:
  push:
    branches: [main]
    paths: ["packages/core/**", ".github/workflows/bench.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "The largest fixture, in nodes. 10000 is the run of a push. 100000 adds the parts of the huge fixture."
        default: "10000"
      repeat:
        description: "The runs of each cell up to 10 000 nodes (the time is the median). A cell of 100 000 nodes runs two times."
        default: "3"

permissions:
  contents: read

# On main, a new run does not stop the run in progress. It waits, and a newer run takes the place of a waiting run.
# The nightly run has its own group, so it does not block the runs of a push. On other branches, a new run stops the old run.
concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      max: ${{ steps.plan.outputs.max }}
      repeat: ${{ steps.plan.outputs.repeat }}
    steps:
      - name: Plan the parts
        id: plan
        env:
          MAX: ${{ github.event_name == 'schedule' && '100000' || inputs.max || '10000' }}
          REPEAT: ${{ inputs.repeat || '3' }}
        # Each part has the nodes of its fixtures, the options of `pnpm bench`, the cell limit in milliseconds and the time limit of its job in minutes.
        # A part runs when its smallest fixture is not larger than `max`. The routers `shared-all` and `shared` are the slowest at 10 000 nodes, so they have their own parts.
        run: |
          [[ "$MAX" =~ ^[0-9]+$ ]] || { echo "max must be a number, not '$MAX'"; exit 1; }
          [[ "$REPEAT" =~ ^[1-9][0-9]*$ ]] || { echo "repeat must be a number of 1 or more, not '$REPEAT'"; exit 1; }
          parts=$(jq -nc --argjson max "$MAX" --arg repeat "$REPEAT" '[
            {name: "small", min: 0, max: ([$max, 1000] | min), args: "--repeat \($repeat)", limit: 900000, timeout: 30},
            {name: "large-shared-all", min: 10000, max: 10000, args: "--rows-only --repeat \($repeat) --routers shared-all", limit: 900000, timeout: 40},
            {name: "large-shared", min: 10000, max: 10000, args: "--rows-only --repeat \($repeat) --routers shared,sections", limit: 900000, timeout: 40},
            {name: "large-rest", min: 10000, max: 10000, args: "--rows-only --repeat \($repeat) --skip-routers shared-all,shared,sections", limit: 900000, timeout: 40},
            {name: "huge-sections", min: 100000, max: 100000, args: "--rows-only --repeat 1 --routers sections", limit: 3600000, timeout: 300},
            {name: "huge-sections-tree", min: 100000, max: 100000, args: "--rows-only --repeat 1 --routers sections-tree", limit: 3600000, timeout: 300},
            {name: "huge-rest", min: 100000, max: 100000, args: "--rows-only --repeat 1 --skip-routers sections,sections-tree", limit: 3600000, timeout: 120}
          ] | map(select(.min <= $max))')
          echo "$parts" | jq .
          { echo "parts=$parts"; echo "max=$MAX"; echo "repeat=$REPEAT"; } >> "$GITHUB_OUTPUT"

  part:
    needs: plan
    name: part (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.part.timeout }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      PART: ${{ matrix.part.name }}
      MIN: ${{ matrix.part.min }}
      MAX: ${{ matrix.part.max }}
      ARGS: ${{ matrix.part.args }}
      CELL_LIMIT: ${{ matrix.part.limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the part
        # ARGS holds more than one word, so the shell splits it on purpose.
        run: |
          set -o pipefail
          mkdir -p parts
          start=$SECONDS
          status=0
          # shellcheck disable=SC2086
          pnpm --filter @mark1russell7/highways bench --min "$MIN" --max "$MAX" --cell-limit "$CELL_LIMIT" $ARGS \
            --json "$GITHUB_WORKSPACE/parts/bench-$PART.json" --side-tables "$GITHUB_WORKSPACE/parts/side-$PART.txt" | tee "parts/table-$PART.txt" || status=$?
          echo "$((SECONDS - start))" > "parts/time-$PART.txt"
          echo "$status" > "parts/status-$PART.txt"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-part-${{ matrix.part.name }}
          path: parts/
          if-no-files-found: warn

  join:
    needs: [plan, part]
    # The join also runs when a part fails or passes the time limit of its job. The table of the parts tells which part did not finish.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARTS: ${{ needs.plan.outputs.parts }}
      MAX: ${{ needs.plan.outputs.max }}
      REPEAT: ${{ needs.plan.outputs.repeat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The join reads only the source of the core, which needs no package, so the job does not install the packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-part-*
          path: parts
          merge-multiple: true
      - name: Join the parts
        run: |
          set -o pipefail
          mkdir -p parts
          node packages/core/scripts/bench-join.ts --parts parts --json "$GITHUB_WORKSPACE/bench.json" | tee table.txt
          {
            echo "## Bench (max $MAX nodes, $REPEAT runs up to 10 000 nodes, 2 runs at 100 000 nodes)"
            echo
            echo '```'
            cat table.txt
            echo '```'
            echo
            echo "### Parts"
            echo
            echo "| part | nodes | minutes | state |"
            echo "|---|---|---:|---|"
            jq -r '.[] | [.name, "\(.min) to \(.max)"] | @tsv' <<< "$PARTS" | while IFS=$'\t' read -r name nodes; do
              if [ -f "parts/status-$name.txt" ]; then
                minutes=$(awk -v s="$(cat "parts/time-$name.txt")" 'BEGIN { printf "%.1f", s / 60 }')
                if [ "$(cat "parts/status-$name.txt")" = "0" ]; then state="finished"; else state="failed (exit $(cat "parts/status-$name.txt"))"; fi
              else
                minutes="-"
                state="did not finish (the time limit of the job, or a cancel)"
              fi
              echo "| $name | $nodes | $minutes | $state |"
            done
            echo
            echo "Cells over the limit: $(jq '[.[] | select(.overLimit)] | length' bench.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ github.sha }}
          path: bench.json
          if-no-files-found: warn
