# The same routes on each platform (XPLAT-HASH). Each cell of the matrix (a system and a node version) routes the inputs of the joint bench
# of layout-contract with `scripts/xplat.ts`: the route hash, the exact routes and the hashes of the Math calls. The job locate finds the first chunk
# of 1000 calls that differs between two cells. The job near routes those inputs again and writes each call of those chunks in full.
# The last job compares the cells with `scripts/xplat-summary.ts` and writes the summary. The note `docs/research/XPLAT.md` gives the result.
# The claim of the check is byte-equal routes on each cell. A route that differs, a repeat that differs or a cell with another count of rows ends the job red, and `CI.md` tells what a red means.
# The check also runs each week on its own minute, because a runner image can move with no change here. The node versions do not float.
name: Xplat

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Also route the 24 inputs of the artifact xplat-graphs of the layout-contract run below. With false, only the 3 inputs of packages/core/scripts/data/xplat."
        default: "true"
      run:
        description: "The id of the layout-contract run with the artifact xplat-graphs."
        default: "40688908137"
      fault:
        description: "The fault of the flip of the verdict: none, route or short. The job summary puts it on one real cell before the verdict, and the gate must go red."
        default: "none"
  # Each pull request starts this workflow, so the check "Xplat OK" of the ruleset is always there (CI-OK).
  # The job changes skips the cells when the pull request does not change the core or the trace.
  # Xplat is not a job of ci.yml: release.yml gives ci.yml only "contents: read", and the job inputs needs "actions: read".
  pull_request:
  schedule:
    - cron: "11 5 * * 2"

permissions:
  contents: read

concurrency:
  # Each set of inputs has its own group, so the dispatches of a flip do not cancel each other.
  group: xplat-${{ github.ref }}-${{ inputs.all }}-${{ inputs.run }}-${{ inputs.fault }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The cells of the matrices of trace and near: process.platform and the major node version (FAIL-CLOSED). Change it with the matrices.
  CELLS: linux-node24,linux-node26,win32-node24,win32-node26

jobs:
  # The paths that start the cells. A dispatch always starts them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      xplat: ${{ steps.diff.outputs.xplat }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "xplat=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          if grep -qE '^(packages/core/src/|packages/core/scripts/data/xplat/|packages/core/scripts/xplat(-summary)?\.ts$|packages/core/scripts/gates/(flip|inputs|paired|pair-confirm)\.ts$|packages/core/scripts/sections-(gate|confirm)-verdict\.ts$|\.github/workflows/xplat\.yml$)' <<< "$files"; then echo "xplat=true" >> "$GITHUB_OUTPUT"; else echo "xplat=false" >> "$GITHUB_OUTPUT"; fi

  inputs:
    needs: changes
    if: needs.changes.outputs.xplat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ALL: ${{ inputs.all || 'true' }}
      RUN: ${{ inputs.run || '40688908137' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the inputs
        run: |
          mkdir -p inputs
          cp packages/core/scripts/data/xplat/*.json.gz inputs/
          if [ "$ALL" = "true" ]; then
            # The artifact of another public repository. A run with `all` true states 75 rows, so a failed download ends the run here, with its own text.
            if gh run download "$RUN" -R mark1russell7/layout-contract -n xplat-graphs -D inputs/all; then
              echo "The job downloaded the artifact xplat-graphs of the layout-contract run $RUN." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::The job could not download the artifact xplat-graphs of the layout-contract run $RUN, so it cannot read the 75 rows of this check."
              exit 1
            fi
          fi
          echo "The inputs: $(find inputs -name '*.json*' | sed 's#.*/##; s#\.json.*##' | sort -u | wc -l) graphs." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xplat-inputs
          path: inputs/

  trace:
    needs: inputs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories, and heavy work keeps 28 of them at most. So a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The full versions, so a new node reaches this check only on the pull request of Renovate that moves it. `CELLS` names the majors.
        node:
          - 24.22.2 # node-24
          - 26.13.0 # node-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: xplat-inputs
          path: inputs
      - name: Trace the routes
        env:
          XPLAT_CALLS: "1"
        run: |
          set -o pipefail
          node --version
          cd packages/core
          node scripts/xplat.ts --inputs "$GITHUB_WORKSPACE/inputs" --out "$GITHUB_WORKSPACE/trace" --extra shared-stretch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xplat-trace-${{ matrix.os }}-node${{ matrix.node }}
          path: trace/
          if-no-files-found: warn

  locate:
    needs: [changes, trace]
    if: ${{ always() && needs.changes.outputs.xplat == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: xplat-trace-*
          path: cells
      - name: Find the first chunk of calls that differs
        run: node packages/core/scripts/xplat-summary.ts --cells cells --expect "$CELLS" --targets targets.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xplat-targets
          path: targets.json

  near:
    needs: locate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories, and heavy work keeps 28 of them at most. So a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The full versions, so a new node reaches this check only on the pull request of Renovate that moves it. `CELLS` names the majors.
        node:
          - 24.22.2 # node-24
          - 26.13.0 # node-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: xplat-inputs
          path: inputs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: xplat-targets
          path: targets
      - name: Log the calls of the chunks that differ
        run: |
          set -o pipefail
          cd packages/core
          XPLAT_NEAR="$GITHUB_WORKSPACE/targets/targets.json" node scripts/xplat.ts --inputs "$GITHUB_WORKSPACE/inputs" --out "$GITHUB_WORKSPACE/near" --extra shared-stretch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xplat-near-${{ matrix.os }}-node${{ matrix.node }}
          path: near/
          if-no-files-found: warn

  summary:
    needs: [changes, near]
    if: ${{ always() && needs.changes.outputs.xplat == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: xplat-trace-*
          path: cells
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: xplat-near-*
          path: near
      - name: Put the fault of the dispatch on one cell
        if: ${{ inputs.fault != '' && inputs.fault != 'none' }}
        env:
          FAULT: ${{ inputs.fault }}
        run: node packages/core/scripts/gates/flip.ts --inject "$FAULT" --cells cells
      # The exit code of the script is the exit code of this step, through no pipe. The summary comes from the file, so a red run keeps it.
      - name: The verdict
        env:
          # The rows of a run: 24 inputs with 3 routers, and 3 of them with `sections` too, or 10 rows on the 3 inputs of the repository. Only a dispatch can give `all` false.
          ROWS: ${{ (inputs.all || 'true') == 'true' && '75' || '10' }}
        run: |
          mkdir -p near
          status=0
          node packages/core/scripts/xplat-summary.ts --cells cells --expect "$CELLS" --rows "$ROWS" --near near --out xplat.md --json xplat.json || status=$?
          if [ -f xplat.md ]; then cat xplat.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      # The flip reads only the reference cell, so it holds on a run with a fault. It runs in each run of this check: no package is installed in this job, and the flip needs none.
      - name: The flip of the verdict
        if: always()
        run: node packages/core/scripts/gates/flip.ts --check xplat --cells cells --out flip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xplat-summary
          if-no-files-found: warn
          path: |
            xplat.md
            xplat.json
            flip/

  # The check of the ruleset (CI.md, "The check of the ruleset"). It needs each other job of this file.
  # A skipped job fails it (template #85), except the jobs of the cells on a pull request without changes to the core.
  # Only a run that reads the whole check writes that name. A dispatch with another `all`, `run` or `fault` writes `Xplat partial`, so it cannot satisfy the ruleset on any commit.
  xplat-ok:
    name: ${{ ((inputs.all || 'true') == 'true' && (inputs.run || '40688908137') == '40688908137' && (inputs.fault || 'none') == 'none') && 'Xplat OK' || 'Xplat partial' }}
    if: always()
    needs: [changes, inputs, trace, locate, near, summary]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: ${{ needs.changes.outputs.xplat != 'true' && 'inputs trace locate near summary' || '' }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
