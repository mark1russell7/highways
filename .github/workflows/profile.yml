# The profile of one router on one fixture. It writes the functions that take the most time to the summary
# of the run and keeps the raw profile (profile.cpuprofile) as an artifact. Profiles run here, not on a local machine.
name: Profile

on:
  workflow_dispatch:
    inputs:
      router:
        description: "The router"
        default: "sections"
      fixture:
        description: "The fixture"
        default: "large-clustered"

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROUTER: ${{ inputs.router }}
      FIXTURE: ${{ inputs.fixture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Profile the router
        run: |
          set -o pipefail
          pnpm --filter @mark1russell7/highways run profile --router "$ROUTER" --fixture "$FIXTURE" --out "$GITHUB_WORKSPACE/profile.cpuprofile" | tee table.txt
          { echo "## Profile"; echo; cat table.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: profile-${{ github.sha }}
          path: profile.cpuprofile
          if-no-files-found: warn
