# The sections time gate (GATE-LIMITS slice 1). It fails a pull request when `sections-tree` at 10 000 nodes gets slower.
# The job uses the confirm mode of `Sections bisect`: `scripts/sections-bisect.ts --gate` and `scripts/gates/pair-confirm.ts`.
# It times four arms in turn, each route in a fresh process: the parent of the pull request, the head, the A/A copy of the parent and the fixed base.
# Each arm routes the same board: the fixture `large-clustered` of `fa1dd82~1`.
# The check against the parent fails above 1 + max(0.05, the A/A spread of the job). The check against the fixed base fails above 1.10.
# The fixed base is in `packages/core/scripts/data/sections-gate/fixed-base.json`. `docs/PROMOTION.md` gives the values and their reasons.
name: Sections gate

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:
    inputs:
      parent:
        description: "The commit to time the checkout against. The default is the commit before the checkout."
        default: "HEAD~1"
      rounds:
        description: "The timed rounds of each arm, from 1 to 20."
        default: "10"

permissions:
  contents: read

concurrency:
  # One run for each workflow and ref (RUNNER-SLOTS). A new head of a pull request cancels the old run. A dispatch waits for the run before it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@20dea158bc3a00838428ea75cbe6ff88b25606bb # main
        with:
          # The source of the core, and the files of the gate itself. A pull request that changes only docs does not start the job gate.
          paths: |
            packages/core/src/**
            .github/workflows/sections-gate.yml
            packages/core/scripts/sections-bisect.ts
            packages/core/scripts/sections-gate-verdict.ts
            packages/core/scripts/gates/pair-confirm.ts
            packages/core/scripts/gates/paired.ts
            packages/core/scripts/data/sections-gate/**
            !**/*.md
            !**/*.test.ts

  gate:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    # The job times 4 arms x 10 rounds = 40 routes of sections-tree at 10 000 nodes. One route takes 30 to 60 s, so the routes take 20 to 40 min.
    # Each child loads its core and reads the board in about 3 s: 2 min more. The 3 or 4 worktrees and their installs take about 5 min.
    # The sum is 27 to 47 min. The limit is 2 times the worst case: 95 min.
    timeout-minutes: 95
    env:
      # On a pull request, the checkout is the merge commit, and its first parent is the head of the base branch.
      PARENT: ${{ github.event_name == 'pull_request' && 'HEAD^1' || inputs.parent }}
      ROUNDS: ${{ inputs.rounds || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The worktrees of the board, the parent and the fixed base need the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time the head against the parent and the fixed base
        run: |
          # The script exits with the code 1 when a check does not pass. The summary gets the record before the step fails.
          status=0
          node packages/core/scripts/sections-bisect.ts --gate --parent "$PARENT" --rounds "$ROUNDS" --trees "$RUNNER_TEMP/trees" --out "$GITHUB_WORKSPACE/out" > /dev/null || status=$?
          [ -f out/sections-gate.md ] && cat out/sections-gate.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sections-gate-${{ github.sha }}
          path: |
            out/sections-gate.json
            out/sections-gate.md
          if-no-files-found: warn

  sections-gate-ok:
    name: Sections gate OK
    if: always()
    needs: [changes, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@20dea158bc3a00838428ea75cbe6ff88b25606bb # main
        with:
          needs: ${{ toJSON(needs) }}
