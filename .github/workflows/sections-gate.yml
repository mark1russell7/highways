# The sections time gate (GATE-LIMITS slices 1 to 3). It fails a pull request when `sections-tree` at 10 000 nodes gets slower.
# The job uses the confirm mode of `Sections bisect`: `scripts/sections-bisect.ts --gate` and `scripts/gates/pair-confirm.ts`.
# It times four arms in turn, each route in a fresh process: the parent of the pull request, the head, the A/A copy of the parent and the fixed base.
# The step commits resolves the head and the parent to full hashes one time (GATE-CONFIRM-SHA). Each later step gets only these hashes.
# A dispatch with `-f head=<sha>` times that commit against its first parent. A name that does not resolve fails the job.
# Each arm routes the same board: the fixture `large-clustered` of `fa1dd82~1`.
# A run with an A/A spread above the noise cap log(1.06) on |log r| cannot decide. Then the job `retry` runs the gate once more on a fresh runner.
# Such a run writes a warning "No read" to the check, with the case, the rounds and the CPU model, so the pass of the retry does not hide it.
# A second run that cannot decide fails, so a noisy run does not pass.
# The check against the parent uses `timeVerdict` of `@mark1russell7/rigor-bench`, with the margin log(1.05) and the pool of `packages/core/scripts/data/sections-gate/aa-pool.json`.
# The check against the fixed base fails above 1.10.
# The fixed base is in `packages/core/scripts/data/sections-gate/fixed-base.json`. `docs/PROMOTION.md` gives the values and their reasons.
name: Sections gate

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  schedule:
    # The paths of the job changes leave out the code that the import walk does not reach. So this run times main in full each day.
    # The check against the fixed base shows a rise that many pull requests made together. The check against the parent shows only the last commit.
    - cron: "24 6 * * *"
  workflow_dispatch:
    inputs:
      head:
        description: "The commit to time, as a hash or a name. The default is the checkout of the dispatch."
        default: ""
      parent:
        description: "The commit to time the head against. The default is the first parent of the head."
        default: ""
      rounds:
        description: "The timed rounds of each arm, from 1 to 20."
        default: "10"

permissions:
  contents: read

concurrency:
  # One run for each workflow and ref (RUNNER-SLOTS). A new head of a pull request cancels the old run. A dispatch waits for the run before it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The paths come from the imports of the measured route (GATE-SCOPE). A pull request that changes another router does not start the job gate.
      - id: scope
        run: |
          {
            echo 'paths<<PATHS'
            node packages/core/scripts/gates/scope.ts || echo '**'
            echo PATHS
          } >> "$GITHUB_OUTPUT"
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          paths: ${{ steps.scope.outputs.paths }}
      # This step gives the paths to the matcher of the action. A change inside the walk runs the gate, and a change outside it skips. Any other result fails the job.
      - name: Prove the paths
        env:
          PATHS: ${{ steps.scope.outputs.paths }}
        run: |
          matcher=$(find "$RUNNER_WORKSPACE/../_actions/mark1russell7/template" -name match.jq | head -n 1)
          decide() { printf '%s\n' "$1" | jq -R -s -r --arg paths "$PATHS" --arg ignore "" -f "$matcher"; }
          [ "$(decide packages/core/src/routers/sections.ts)" = true ] || { echo "::error::A change of the measured router does not run the gate."; exit 1; }
          [ "$PATHS" = '**' ] || [ "$(decide packages/core/src/routers/repel/index.ts)" = false ] || { echo "::error::A change of another router runs the gate."; exit 1; }

  gate:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    # The job times 4 arms x 10 rounds = 40 routes of sections-tree at 10 000 nodes. One route takes 30 to 60 s, so the routes take 20 to 40 min.
    # Each child loads its core and reads the board in about 3 s: 2 min more. The 3 or 4 worktrees and their installs take about 5 min.
    # The sum is 27 to 47 min. The limit is 2 times the worst case: 95 min.
    # The jobs gate and retry run one after the other. The runs so far took 22 and 32 min, so the two runs take 2 x 32 = 64 min at the most.
    # With the limits, the workflow takes 2 x 95 = 190 min at the most.
    timeout-minutes: 95
    outputs:
      # The value is false when the run cannot decide. Then the job retry runs.
      decided: ${{ steps.time.outputs.decided }}
      # The full hashes and the input texts of the head and the parent. The job retry times the same commits.
      head: ${{ steps.commits.outputs.head }}
      head-input: ${{ steps.commits.outputs.head-input }}
      parent: ${{ steps.commits.outputs.parent }}
      parent-input: ${{ steps.commits.outputs.parent-input }}
    env:
      ROUNDS: ${{ inputs.rounds || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The worktrees of the board, the parent and the fixed base need the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the head and the parent to full hashes
        id: commits
        env:
          # On a pull request, the checkout is the merge commit, and its first parent is the head of the base branch.
          # An empty head is the checkout, and an empty parent is the first parent of the head.
          HEAD_INPUT: ${{ github.event_name == 'pull_request' && 'HEAD' || inputs.head }}
          PARENT_INPUT: ${{ github.event_name == 'pull_request' && 'HEAD^1' || inputs.parent }}
        run: |
          # A name that does not resolve exits with the code 1, so the job fails before it times an arm (FAIL-CLOSED).
          node packages/core/scripts/gates/commits.ts --head "$HEAD_INPUT" --parent "$PARENT_INPUT" >> "$GITHUB_OUTPUT"
      - name: Time the head against the parent and the fixed base
        id: time
        env:
          HEAD_SHA: ${{ steps.commits.outputs.head }}
          HEAD_INPUT: ${{ steps.commits.outputs.head-input }}
          PARENT_SHA: ${{ steps.commits.outputs.parent }}
          PARENT_INPUT: ${{ steps.commits.outputs.parent-input }}
        run: |
          # The exit code is 0 for a pass, 1 for a fail and 3 for a run that cannot decide. The summary gets the record before the step ends.
          status=0
          node packages/core/scripts/sections-bisect.ts --gate --attempt 1 --head "$HEAD_SHA" --head-input "$HEAD_INPUT" --parent "$PARENT_SHA" --parent-input "$PARENT_INPUT" --rounds "$ROUNDS" --trees "$RUNNER_TEMP/trees" --out "$GITHUB_WORKSPACE/out" > /dev/null || status=$?
          [ -f out/sections-gate.md ] && cat out/sections-gate.md >> "$GITHUB_STEP_SUMMARY"
          # The script writes the line of a run that does not pass to the check, with the case, the rounds and the CPU model (NO-READ-LINE).
          # A script that stops before its record writes no line, so this step writes it.
          [ "$status" -eq 0 ] || [ -f out/sections-gate.json ] || echo "::error title=Sections gate::run 1 of 2: No read: the script stopped with the code $status before its record."
          if [ "$status" -eq 3 ]; then
            echo "decided=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "decided=true" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sections-gate-${{ github.sha }}
          path: |
            out/sections-gate.json
            out/sections-gate.md
          if-no-files-found: warn

  retry:
    # The second run of the gate, on a fresh runner. It starts only after a first run that cannot decide.
    needs: [changes, gate]
    if: needs.changes.outputs.match == 'true' && needs.gate.result == 'success' && needs.gate.outputs.decided == 'false'
    runs-on: ubuntu-latest
    # The same work as the job gate: 27 to 47 min, and the limit is 95 min. The jobs gate and retry take 2 x 32 = 64 min at the most so far.
    # With the limits, the workflow takes 2 x 95 = 190 min at the most.
    timeout-minutes: 95
    env:
      ROUNDS: ${{ inputs.rounds || '10' }}
      # The job gate resolved the commits one time. This job times the same full hashes, also when the branch moved.
      HEAD_SHA: ${{ needs.gate.outputs.head }}
      HEAD_INPUT: ${{ needs.gate.outputs.head-input }}
      PARENT_SHA: ${{ needs.gate.outputs.parent }}
      PARENT_INPUT: ${{ needs.gate.outputs.parent-input }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time the head against the parent and the fixed base once more
        run: |
          # In the second run, a run that cannot decide exits with the code 1, so a noisy run does not pass.
          status=0
          node packages/core/scripts/sections-bisect.ts --gate --attempt 2 --head "$HEAD_SHA" --head-input "$HEAD_INPUT" --parent "$PARENT_SHA" --parent-input "$PARENT_INPUT" --rounds "$ROUNDS" --trees "$RUNNER_TEMP/trees" --out "$GITHUB_WORKSPACE/out" > /dev/null || status=$?
          [ -f out/sections-gate.md ] && cat out/sections-gate.md >> "$GITHUB_STEP_SUMMARY"
          # The script writes the line of a run that does not pass to the check (NO-READ-LINE). A script that stops before its record writes no line.
          [ "$status" -eq 0 ] || [ -f out/sections-gate.json ] || echo "::error title=Sections gate::run 2 of 2: No read: the script stopped with the code $status before its record."
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sections-gate-${{ github.sha }}-retry
          path: |
            out/sections-gate.json
            out/sections-gate.md
          if-no-files-found: warn

  sections-gate-ok:
    name: Sections gate OK
    if: ${{ !cancelled() }}
    needs: [changes, gate, retry]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          needs: ${{ toJSON(needs) }}
          # The job retry is skipped after a first run that decides. That skip is a pass. A failed or cancelled retry fails the check.
          allow-skip: retry
