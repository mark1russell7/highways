# Throwaway: the guarded record of the rule arms, with its times. This branch is not merged.
name: Remeasure

on:
  workflow_dispatch:
    inputs:
      claim:
        description: "Ignored on this branch."
        type: choice
        options: [h3, portfolio-speed, route-scale]
        default: h3

permissions:
  contents: read

jobs:
  rule-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p out
      - name: Measure the rule arms
        run: cd packages/core && node scripts/rule-energy.ts ../../out/energy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rule-guard
          path: out/energy.json
          if-no-files-found: warn
