# Throwaway: the count of the level crossings over all families. This branch is not merged.
name: Remeasure

on:
  workflow_dispatch:
    inputs:
      claim:
        description: "Ignored on this branch."
        type: choice
        options: [h3, portfolio-speed, route-scale]
        default: h3

permissions:
  contents: read

jobs:
  level-crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Count the level crossings
        run: node packages/core/scripts/level-crossings.ts out/level-crossings.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: level-crossings
          path: out/level-crossings.json
          if-no-files-found: warn
