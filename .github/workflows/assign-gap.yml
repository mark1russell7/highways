# The count gap of the sweep of `assign` (ASSIGN-BOUND). The sweep and the exact plan run on the same seeded walls.
# Each family has its own job, so a family with a slow exact plan does not stop the others. The counts are the same on each machine.
# The file of each job has a row for each size. A later row of one family and size replaces an earlier row.
name: Assign gap

on:
  workflow_dispatch:
    inputs:
      args:
        description: "More arguments of scripts/assign-gap.ts."
        default: ""

permissions:
  contents: read

concurrency:
  # One run for each ref (RUNNER-SLOTS). A new run waits for the run before it.
  group: assign-gap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        family: [ample, tight, clustered, fractional]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure the family
        env:
          ARGS: ${{ inputs.args }}
          FAMILY: ${{ matrix.family }}
        working-directory: packages/core
        run: |
          read -ra args <<< "$ARGS"
          timeout 1200 node --max-old-space-size=12000 scripts/assign-gap.ts --families "$FAMILY" --cap 20 --out "$GITHUB_WORKSPACE/assign-gap-$FAMILY.jsonl" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: assign-gap-${{ matrix.family }}
          path: assign-gap-${{ matrix.family }}.jsonl
          if-no-files-found: warn
