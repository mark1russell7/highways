# Builds packages/site and publishes it to GitHub Pages at https://metrograph-labs.github.io/highways/, with
# the shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
# The build runs no benchmark. The site reads only committed files: the benchmark snapshot of docs/research/bench/
# or the newer record of the branch bench-data, which the job `land` of Bench pushes,
# the verdict snapshots of docs/research/verdicts/, the idea records and the roadmap (SITE-LIVE).
# The atlas page derives each week after the newest committed record from the git history (ATLAS-WEEKLY). The shared
# workflow checks out the whole history (fetch-depth 0, its default). The build compares the weeks with the live atlas-weeks.json.
# The shared site-pages action adds the Status page (from docs/ROADMAP.md) and the Releases page (from npm).
# A pull request builds and checks the site in a browser, with no deploy.
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Each day, in case a release fails after it publishes
  schedule:
    - cron: "8 5 * * *"
    # Each Sunday soon after the end of Saturday in UTC, so the atlas page gets the record of the week (ATLAS-WEEKLY)
    - cron: "8 1 * * 0"

permissions: {}

# One deployment at a time. A newer push replaces a deployment that waits, but it does not stop a deployment that runs (rule `main-runs-finish`).
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      timeout-minutes: 15
