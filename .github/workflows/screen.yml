# The screen: the cheap test of each new idea before a full build. It runs the strategies of one step on the screen set
# and keeps one JSON record for each run (screen.jsonl) and a short summary (screen.md) as an artifact.
# A pull request that changes the screen runs the screen of the routers, so the time of a full screen stays known.
name: Screen

on:
  pull_request:
    paths: ["packages/core/src/bench/screen/**", "packages/core/scripts/screen.ts", "corpus/**", ".github/workflows/screen.yml"]
  workflow_dispatch:
    inputs:
      step:
        description: "The step: router, highway, curve or group."
        default: "router"
      strategy:
        description: "Names of the registry, with commas. Empty: the built-in strategies of the step."
        default: ""
      module:
        description: "Prototype files that export strategies, with commas, relative to the root of the repository. Empty: none."
        default: ""
      families:
        description: "Families of the screen set, with commas. Empty: each family."
        default: ""
      wrap:
        description: "Wrappers of each router, with commas: stable, repair. Empty: none."
        default: ""
      shuffles:
        description: "The number of random orders of the edges for the order fragility (W3). 0: no measure."
        default: "0"
      minutes:
        description: "The time limit of the job, in minutes."
        default: "15"

permissions:
  contents: read

concurrency:
  group: screen-${{ github.ref }}-${{ inputs.step }}-${{ inputs.strategy }}-${{ inputs.families }}-${{ inputs.wrap }}-${{ inputs.shuffles }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.minutes || '15') }}
    env:
      STEP: ${{ inputs.step || 'router' }}
      STRATEGY: ${{ inputs.strategy || '' }}
      MODULE: ${{ inputs.module || '' }}
      FAMILIES: ${{ inputs.families || '' }}
      WRAP: ${{ inputs.wrap || '' }}
      SHUFFLES: ${{ inputs.shuffles || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the screen
        run: |
          set -o pipefail
          args=(--step "$STEP" --out "$GITHUB_WORKSPACE/screen.jsonl" --summary "$GITHUB_WORKSPACE/screen.md")
          [ -n "$STRATEGY" ] && args+=(--strategy "$STRATEGY")
          if [ -n "$MODULE" ]; then
            modules=""
            IFS=',' read -ra list <<< "$MODULE"
            for m in "${list[@]}"; do modules="${modules:+$modules,}$GITHUB_WORKSPACE/$m"; done
            args+=(--module "$modules")
          fi
          [ -n "$FAMILIES" ] && args+=(--families "$FAMILIES")
          [ -n "$WRAP" ] && args+=(--wrap "$WRAP")
          [ "$SHUFFLES" != "0" ] && args+=(--shuffles "$SHUFFLES")
          start=$SECONDS
          pnpm --filter @mark1russell7/highways screen "${args[@]}"
          {
            cat screen.md
            echo
            echo "The job ran the screen in $((SECONDS - start)) s."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screen-${{ inputs.step || 'router' }}-${{ inputs.wrap || 'none' }}-${{ inputs.shuffles || '0' }}-${{ github.sha }}
          path: |
            screen.jsonl
            screen.md
          if-no-files-found: warn
