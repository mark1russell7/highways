# The screen: the cheap test of each new idea before a full build. It runs the strategies of one step on the screen set
# and keeps one JSON record for each run (screen.jsonl) and a short summary (screen.md) as an artifact.
# A pull request that changes the core source or the screen runs the screens of the routers and of the highways.
# Thus the records of each change are known, and the pull request needs no manual dispatch.
name: Screen

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:
    inputs:
      step:
        description: "The step: group, plugs, router, highway, levels, curve or whole. The value verdict screens the 5 steps of the verdict snapshots in one run, 3 at a time. Use it with no strategy and no paired."
        default: "router"
      strategy:
        description: "Names of the registry, with commas. Empty: the built-in strategies of the step."
        default: ""
      module:
        description: "Prototype files that export strategies, with commas, relative to the root of the repository. Empty: none."
        default: ""
      families:
        description: "Families of the screen set, with commas. Empty: each family."
        default: ""
      wrap:
        description: "Wrappers of each router, with commas: stable, repair. Empty: none."
        default: ""
      shuffles:
        description: "The number of random orders of the edges for the order fragility (W3). 0: no measure."
        default: "0"
      edits:
        description: "The number of seeded edits of each highway strategy, for the stability of its highways. 0: no edits."
        default: "0"
      minutes:
        description: "The time limit of the job, in minutes. With exact: the time limit of each shard. With paired: 60 or more. With time: 150 or more."
        default: "15"
      set:
        description: "The screen set: screen-v1, screen-v2 (10 seeds of each family, CORPUS-SEEDS), screen-v3 (15 families, CORPUS-FAMILIES), screen-v4 (the boards of screen-v2 after makeRoom, PASS-GRID), screen-v5 (the boards of screen-v3 under each key of the edges, COLLECTION-KEY), exact-v1, exact-v1-bounds or moves-v1 (the small boards of REBUILD-SILENT). The set exact-v1 also gives the gap closed (MEAS2)."
        default: "screen-v1"
      members:
        description: "The members of each family, as from-to, for example 10-23, in place of the members of the set (PROMO-CANALS). Empty: the members of the set."
        default: ""
      activation:
        description: "The families of the decision inputs of the activation report (ACTIVATION), with commas, or all. Empty: no report."
        default: ""
      exact:
        description: "The arguments of pnpm exact for the exact solves of MEAS2, for example --set exact-v1 --shards 40. Empty: the screen runs."
        default: ""
      time:
        description: "The arguments of pnpm portfolio:time for the times of the portfolio (PORTFOLIO), for example --sizes 10,24,40 --shards 16. Empty: the screen runs."
        default: ""
      report:
        description: "The ids of CI runs for the report of the portfolio: --exact <id> --screen <id,...> --time <id>. Empty: the screen runs."
        default: ""
      node:
        description: "The major version of Node.js of the screen."
        default: "26"
      paired:
        description: "The base of the paired time (MEASURE-ISOLATE), for example shared. 5 jobs time the base and the strategies of the call in turn, with an A/A arm. Then the promotion test reads the 5 reports. Empty: no paired time."
        default: ""

permissions:
  contents: read

concurrency:
  group: screen-${{ github.ref }}-${{ inputs.step }}-${{ inputs.strategy }}-${{ inputs.families }}-${{ inputs.wrap }}-${{ inputs.shuffles }}-${{ inputs.edits }}-${{ inputs.module }}-${{ inputs.set }}-${{ inputs.members }}-${{ inputs.activation }}-${{ inputs.exact }}-${{ inputs.time }}-${{ inputs.report }}-${{ inputs.node }}
  cancel-in-progress: true

jobs:
  # The exact solves of MEAS2 run in the workflow `Exact`, in shards.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@21c4cb628bc2e0e1be5b21fa92fd3c688400ecab # main
        with:
          paths: |
            packages/core/src/**
            packages/core/scripts/screen.ts
            corpus/**
            .github/workflows/screen.yml

  exact:
    needs: changes
    if: ${{ needs.changes.outputs.match == 'true' && (inputs.exact) }}
    uses: ./.github/workflows/exact.yml
    with:
      args: ${{ inputs.exact }}
      minutes: ${{ inputs.minutes || '120' }}

  # The times of the portfolio run in the workflow `Portfolio`, in shards.
  time:
    needs: changes
    if: ${{ needs.changes.outputs.match == 'true' && (inputs.time || inputs.report) }}
    uses: ./.github/workflows/portfolio.yml
    permissions:
      contents: read
      actions: read
    with:
      args: ${{ inputs.time }}
      report: ${{ inputs.report }}
      # Each shard of the times starts fresh processes (BENCH-FRESH-CASES), so it gets 150 minutes or more.
      minutes: ${{ fromJSON(inputs.minutes || '15') < 150 && '150' || inputs.minutes }}

  screen:
    needs: changes
    if: ${{ needs.changes.outputs.match == 'true' && (!inputs.exact && !inputs.time && !inputs.report) }}
    runs-on: ubuntu-latest
    # A paired job starts a fresh process for each arm, each input and each round (BENCH-FRESH-CASES), so it gets 60 minutes or more.
    timeout-minutes: ${{ fromJSON(inputs.paired && fromJSON(inputs.minutes || '15') < 60 && '60' || inputs.minutes || '15') }}
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories, and heavy work keeps 28 of them at most. So a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        # A pull request screens both steps. A dispatch screens its own step. The value verdict screens the 5 steps of the verdict snapshots (RESULTS-READ): one run in place of 5 runs in the queue.
        step: ${{ fromJSON(github.event_name == 'pull_request' && '["router","highway"]' || inputs.step == 'verdict' && '["router","highway","plugs","levels","whole"]' || format('["{0}"]', inputs.step || 'router')) }}
        # A paired screen runs 5 jobs, because the promotion time test reads 5 reports (MEASURE-ISOLATE). Each job is a full screen with its own report.
        job: ${{ fromJSON(inputs.paired && '[1,2,3,4,5]' || '[1]') }}
    env:
      STEP: ${{ matrix.step }}
      STRATEGY: ${{ inputs.strategy || '' }}
      MODULE: ${{ inputs.module || '' }}
      FAMILIES: ${{ inputs.families || '' }}
      WRAP: ${{ inputs.wrap || '' }}
      SHUFFLES: ${{ inputs.shuffles || '0' }}
      EDITS: ${{ inputs.edits || '0' }}
      SET: ${{ inputs.set || 'screen-v1' }}
      ACTIVATION: ${{ inputs.activation || '' }}
      MEMBERS: ${{ inputs.members || '' }}
      PAIRED: ${{ inputs.paired || '' }}
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node || '26' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the screen
        run: |
          set -o pipefail
          args=(--step "$STEP" --set "$SET" --out "$GITHUB_WORKSPACE/screen.jsonl" --summary "$GITHUB_WORKSPACE/screen.md")
          [ -n "$STRATEGY" ] && args+=(--strategy "$STRATEGY")
          if [ -n "$MODULE" ]; then
            modules=""
            IFS=',' read -ra list <<< "$MODULE"
            for m in "${list[@]}"; do modules="${modules:+$modules,}$GITHUB_WORKSPACE/$m"; done
            args+=(--module "$modules")
          fi
          [ -n "$FAMILIES" ] && args+=(--families "$FAMILIES")
          [ -n "$MEMBERS" ] && args+=(--members "$MEMBERS")
          [ -n "$WRAP" ] && args+=(--wrap "$WRAP")
          [ "$SHUFFLES" != "0" ] && args+=(--shuffles "$SHUFFLES")
          [ "$EDITS" != "0" ] && args+=(--edits "$EDITS")
          [ -n "$ACTIVATION" ] && args+=(--activation "$ACTIVATION")
          # The paired time runs the arms of the comparison in this job (MEASURE-ISOLATE), one fresh process at a time.
          # Each job of a paired screen writes its own report, in mode fresh with the A/A arm (BENCH-FRESH-CASES).
          [ -n "$PAIRED" ] && args+=(--paired "$GITHUB_WORKSPACE/paired-job$JOB.json" --paired-base "$PAIRED")
          start=$SECONDS
          pnpm --filter @mark1russell7/highways screen "${args[@]}"
          {
            cat screen.md
            echo
            echo "The job ran the screen in $((SECONDS - start)) s."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screen-${{ inputs.set || 'screen-v1' }}-${{ matrix.step }}-${{ inputs.wrap || 'none' }}-${{ inputs.shuffles || '0' }}-${{ inputs.edits || '0' }}-${{ github.sha }}${{ inputs.paired && format('-job{0}', matrix.job) || '' }}
          path: |
            screen.jsonl
            screen.md
            paired-job*.json
          if-no-files-found: warn

  # The promotion time test of a paired screen (MEASURE-ISOLATE). It reads the reports of the 5 jobs, and it runs only when each job gave its report.
  # A missing report fails this job (FAIL-CLOSED). The records of the job 1 are the corpus of the win test.
  promotion:
    needs: [changes, screen]
    if: ${{ needs.changes.outputs.match == 'true' && (always() && github.event_name == 'workflow_dispatch' && inputs.paired != '' && inputs.strategy != '' && !inputs.exact && !inputs.time && !inputs.report) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEP: ${{ inputs.step || 'router' }}
      STRATEGY: ${{ inputs.strategy }}
      PAIRED: ${{ inputs.paired }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node || '26' }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: screen-${{ inputs.set || 'screen-v1' }}-${{ inputs.step || 'router' }}-${{ inputs.wrap || 'none' }}-${{ inputs.shuffles || '0' }}-${{ inputs.edits || '0' }}-${{ github.sha }}-job*
          path: jobs
      - name: Check the 5 paired reports
        run: |
          got=$(find jobs -name 'paired-job*.json' -printf '%f\n' | sed -E 's/^paired-(job[0-9]+)\.json$/\1/' | paste -sd, -)
          node packages/core/scripts/gates/inputs.ts "paired time reports" --expect job1,job2,job3,job4,job5 --got "$got"
      - name: Run the promotion test of each strategy of the call
        run: |
          set -o pipefail
          reports=$(find "$GITHUB_WORKSPACE/jobs" -name 'paired-job*.json' | sort | paste -sd, -)
          corpus=$(find "$GITHUB_WORKSPACE/jobs" -path '*-job1/screen.jsonl')
          [ -n "$corpus" ] || { echo "::error::The job 1 gave no screen records."; exit 1; }
          mkdir -p out
          IFS=',' read -ra list <<< "$STRATEGY"
          for s in "${list[@]}"; do
            s="${s// /}"
            # The base of the paired time is not a candidate.
            if [ -z "$s" ] || [ "$s" = "$PAIRED" ]; then continue; fi
            pnpm --filter @mark1russell7/highways promotion --candidate "$s" --baseline "$PAIRED" --step "$STEP" --corpus "$corpus" --time "$reports" --out "$GITHUB_WORKSPACE/out/promotion-$s.md" --json "$GITHUB_WORKSPACE/out/promotion-$s.json" > /dev/null
            cat "out/promotion-$s.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: promotion-${{ inputs.set || 'screen-v1' }}-${{ inputs.step || 'router' }}-${{ github.sha }}
          path: out/
          if-no-files-found: warn

  screen-ok:
    name: Screen OK
    if: always()
    needs: [changes, exact, time, screen, promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@21c4cb628bc2e0e1be5b21fa92fd3c688400ecab # main
        with:
          needs: ${{ toJSON(needs) }}
          allow-skip: exact time screen promotion
