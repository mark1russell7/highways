# The sweep of the strategy options (EXPLORER-1). One job runs `packages/core/scripts/sweep.ts` on a step, its strategies and families of `screen-v1`.
# The script changes one number option at a time, and it writes one record of the format `response-records/1`.
# The artifact `sweep` keeps the record. Its owner commits it to `docs/research/sweeps/`, and the explorer page of the site shows it.
# The job is light: one runner, no matrix. A large sweep belongs in its own workflow with slots.
name: Sweep

on:
  workflow_dispatch:
    inputs:
      step:
        description: "The step of the strategies: group, plugs, router, highway, levels, curve, room or whole. A room strategy runs in the strategy pipeline of whole."
        default: "router"
      strategies:
        description: "Names of the registry, with commas. A strategy with no number option gets a line in the log, and the sweep continues."
        default: "corners,trunks,shared"
      families:
        description: "Families of screen-v1, with commas. Empty: each family."
        default: "tiny-uniform,small-clustered"
      draw:
        description: "Empty: the inputs of screen-v1. A number n: n drawn inputs of each family, each with its own values of the dimensions of its family (SPACE-INPUTS)."
        default: ""
      minutes:
        description: "The limit of the job in minutes. A draw takes inputs of each size in the range of its family, so time a small draw first."
        default: "20"

permissions: {}

concurrency:
  # One run for each workflow and ref (RUNNER-SLOTS). A new dispatch waits for the run before it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The sweep of 3 routers on 2 families took 46 s on a shared local machine. The limit keeps a large margin for the install and more families.
    # A large draw or a long list of strategies sets a higher limit with the input minutes.
    timeout-minutes: ${{ fromJSON(inputs.minutes || '20') }}
    permissions:
      contents: read
    env:
      STEP: ${{ inputs.step }}
      STRATEGIES: ${{ inputs.strategies }}
      FAMILIES: ${{ inputs.families }}
      DRAW: ${{ inputs.draw }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sweep the options
        working-directory: packages/core
        run: |
          set -o pipefail
          SECONDS=0
          args=(--step "$STEP" --strategy "$STRATEGIES" --out "$GITHUB_WORKSPACE/out/sweep.json")
          if [ -n "$FAMILIES" ]; then args+=(--families "$FAMILIES"); fi
          if [ -n "$DRAW" ]; then args+=(--draw "$DRAW"); fi
          # The log streams each progress line, so a run that ends at its limit still shows the time of each setting.
          node scripts/sweep.ts "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/sweep.log"
          { echo "## Sweep of $STEP"; echo; echo "The script took $SECONDS s on $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)."; echo; echo '```'; tail -n 20 "$RUNNER_TEMP/sweep.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # A fit that fails leaves a file with the points, so the job keeps it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sweep
          path: out/sweep.json
          if-no-files-found: error
