# The sweep of the strategy options (EXPLORER-1). One job runs `packages/core/scripts/sweep.ts` on a step, its strategies and families of `screen-v1`.
# The script changes one number option at a time, and it writes one record of the format `response-records/1`.
# The artifact `sweep` keeps the record. Its owner commits it to `docs/research/sweeps/`, and the explorer page of the site shows it.
# The job is light: one runner, no matrix. A large sweep belongs in its own workflow with slots.
name: Sweep

on:
  workflow_dispatch:
    inputs:
      step:
        description: "The step of the strategies: group, plugs, router, highway, levels, curve or whole."
        default: "router"
      strategies:
        description: "Names of the registry, with commas. A strategy with no number option gets a line in the log, and the sweep continues."
        default: "corners,trunks,shared"
      families:
        description: "Families of screen-v1, with commas. Empty: each family."
        default: "tiny-uniform,small-clustered"

permissions: {}

concurrency:
  # One run for each workflow and ref (RUNNER-SLOTS). A new dispatch waits for the run before it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The sweep of 3 routers on 2 families took 46 s on a shared local machine. The limit keeps a large margin for the install and more families.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      STEP: ${{ inputs.step }}
      STRATEGIES: ${{ inputs.strategies }}
      FAMILIES: ${{ inputs.families }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sweep the options
        working-directory: packages/core
        run: |
          set -o pipefail
          SECONDS=0
          args=(--step "$STEP" --strategy "$STRATEGIES" --out "$GITHUB_WORKSPACE/out/sweep.json")
          if [ -n "$FAMILIES" ]; then args+=(--families "$FAMILIES"); fi
          node scripts/sweep.ts "${args[@]}" 2>&1 | tail -n 20 | tee "$RUNNER_TEMP/sweep.log"
          { echo "## Sweep of $STEP"; echo; echo "The script took $SECONDS s on $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)."; echo; echo '```'; cat "$RUNNER_TEMP/sweep.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep
          path: out/sweep.json
          if-no-files-found: error
