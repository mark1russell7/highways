# The time of each strategy of the portfolio (PORTFOLIO). Each shard times a part of the strategies on the small boards of `exact-v1`
# at each size, and the last job joins the lines into one artifact. The times of CI machines are not the times of the UI machine,
# so the note `docs/research/PORTFOLIO.md` also gives each time relative to the time of `shared` on the same machine.
name: Portfolio

on:
  workflow_call:
    inputs:
      args:
        type: string
        default: ""
      report:
        type: string
        default: ""
      minutes:
        type: string
        default: "60"
      sets:
        type: string
        default: ""
      api:
        type: string
        default: ""
      pool:
        type: string
        default: ""
      summary:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      args:
        description: "The arguments of pnpm portfolio:time, without --shard and --out. --shards gives the number of shards (default 16)."
        default: "--sizes 10,24,40 --seeds 0,1,2 --repeats 5 --shards 16"
      report:
        description: "The ids of CI runs, with commas: --exact <id> --screen <id,...> --time <id>, and --bounds <id,...> for pnpm bounds. The job then writes the reports from their artifacts, and times nothing."
        default: ""
      minutes:
        description: "The time limit of each shard, in minutes."
        default: "60"
      sets:
        description: "PORTFOLIO-FIT: the id of a run of the times with --members. The job writes the sets, the fit and the summary of the times with pnpm portfolio:sets, and times nothing."
        default: ""
      api:
        description: "The ids of Screen runs of the module portfolio-api.ts, with commas. The job writes the report of pnpm portfolio:api, and times nothing."
        default: ""
      pool:
        description: "With api: the ids of the Screen runs of the pool on screen-v1, with commas (--pool of pnpm portfolio:api)."
        default: ""
      summary:
        description: "FIT-COST: the ids of runs of the times, with commas. The job writes the table of portfolio:time --summary from their shards, and times nothing."
        default: ""

permissions:
  contents: read

concurrency:
  # One run for each ref (RUNNER-SLOTS). A dispatch waits for the run before it.
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !inputs.report && !inputs.sets && !inputs.api && !inputs.summary }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          ARGS: ${{ inputs.args }}
        run: |
          n=$(printf '%s' "$ARGS" | sed -n 's/.*--shards \([0-9][0-9]*\).*/\1/p')
          n=${n:-16}
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((n - 1)))]" >> "$GITHUB_OUTPUT"

  time:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.minutes || '60') }}
    strategy:
      fail-fast: false
      # The account runs at most 20 jobs at one time across all repositories, so a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      ARGS: ${{ inputs.args }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time the shard
        run: |
          set -o pipefail
          nproc
          read -ra args <<< "$ARGS"
          pnpm --filter @mark1russell7/highways portfolio:time "${args[@]}" --shard "$SHARD/$SHARDS" --out "$GITHUB_WORKSPACE/time-$SHARD.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: time-shard-${{ matrix.shard }}
          path: time-${{ matrix.shard }}.jsonl
          if-no-files-found: warn

  merge:
    needs: time
    if: ${{ always() && !inputs.report && !inputs.sets && !inputs.api && !inputs.summary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: time-shard-*
          path: shards
      - name: Join the shards
        run: |
          # With one shard, the action puts the file of the shard in shards/ itself, with no folder of the artifact (FIT-COST).
          find shards -name '*.jsonl' -exec cat {} + > time.jsonl
          echo "The job joined $(wc -l < time.jsonl) timed runs." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-time-${{ github.sha }}
          path: time.jsonl

  # The report of the portfolio from the artifacts of other runs: the screens of `exact-v1` and `screen-v1`, and the times.
  report:
    if: ${{ inputs.report }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      REPORT: ${{ inputs.report }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the script of the report
        run: |
          pnpm --filter @mark1russell7/highways typecheck
          pnpm --filter @mark1russell7/highways exec vitest run src/bench/screen/portfolio.test.ts src/bench/screen/bounds.test.ts
      - name: Download the artifacts and write the report
        run: |
          set -o pipefail
          read -ra words <<< "$REPORT"
          args=()
          bounds=""
          for ((i = 0; i < ${#words[@]}; i += 2)); do
            flag=${words[i]}
            dirs=""
            IFS=',' read -ra ids <<< "${words[i + 1]}"
            # A run of the times also has the file of each shard. Only the joined file counts.
            pattern="screen-*"
            [ "$flag" = "--time" ] && pattern="portfolio-time-*"
            for id in "${ids[@]}"; do
              gh run download "$id" -p "$pattern" -D "$GITHUB_WORKSPACE/runs/$id"
              dirs="${dirs:+$dirs,}$GITHUB_WORKSPACE/runs/$id"
            done
            # The runs of --bounds go only to pnpm bounds (EXACT-BOUNDS), with the records of --exact.
            if [ "$flag" = "--bounds" ]; then bounds="$dirs"; else args+=("$flag" "$dirs"); fi
          done
          pnpm --filter @mark1russell7/highways portfolio "${args[@]}" --out "$GITHUB_WORKSPACE/portfolio.md" --json "$GITHUB_WORKSPACE/portfolio.json" > /dev/null
          cat portfolio.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$bounds" ]; then
            for ((i = 0; i < ${#args[@]}; i += 2)); do
              if [ "${args[i]}" = "--exact" ]; then bounds="${args[i + 1]},$bounds"; fi
            done
            pnpm --filter @mark1russell7/highways bounds --records "$bounds" --out "$GITHUB_WORKSPACE/bounds.md" --json "$GITHUB_WORKSPACE/bounds.json" > /dev/null
            cat bounds.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portfolio-report-${{ github.sha }}
          path: |
            portfolio.md
            portfolio.json
            bounds.md
            bounds.json
          if-no-files-found: warn

  # PORTFOLIO-FIT: the sets, the fit and the report of the portfolio router from the artifacts of other runs.
  fit:
    if: ${{ inputs.sets || inputs.api || inputs.summary }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      SETS: ${{ inputs.sets }}
      API: ${{ inputs.api }}
      POOL: ${{ inputs.pool }}
      SUMMARY: ${{ inputs.summary }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure the bytes of the contract in a bundle of the core
        run: |
          esbuild=$(find node_modules/.pnpm -path "*/node_modules/esbuild/bin/esbuild" | head -1)
          for mode in with without; do
            ext=""; if [ "$mode" = without ]; then ext="--external:@mark1russell7/layout-contract"; fi
            "$esbuild" packages/core/src/index.ts --bundle --minify --format=esm --platform=node $ext --outfile="$GITHUB_WORKSPACE/bundle-$mode.js" --log-level=warning
          done
          w=$(wc -c < "$GITHUB_WORKSPACE/bundle-with.js"); o=$(wc -c < "$GITHUB_WORKSPACE/bundle-without.js")
          {
            echo "| bundle | bytes |"
            echo "|---|---:|"
            echo "| the core with the contract | $w |"
            echo "| the core without the contract | $o |"
            echo "| the contract | $((w - o)) |"
          } | tee bundle.md >> "$GITHUB_STEP_SUMMARY"
      - name: Write the sets and the fit
        if: ${{ env.SETS != '' }}
        run: |
          set -o pipefail
          # The files of the shards are the times. They do not need the job that joins them (FIT-COST).
          gh run download "$SETS" -p "time-shard-*" -D "$GITHUB_WORKSPACE/runs/time"
          files=$(find "$GITHUB_WORKSPACE/runs/time" -name 'time-*.jsonl' | paste -sd, -)
          pnpm --filter @mark1russell7/highways portfolio:sets --time "$files" --time-source "$SETS" --out "$GITHUB_WORKSPACE/portfolio-sets.md" > /dev/null
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp packages/core/src/portfolio/sets.ts packages/core/src/portfolio/fit.ts packages/core/scripts/data/portfolio-times.json "$GITHUB_WORKSPACE/out/"
          cat portfolio-sets.md >> "$GITHUB_STEP_SUMMARY"
      - name: Write the table of the lines of the times
        if: ${{ env.SUMMARY != '' }}
        run: |
          set -o pipefail
          files=""
          IFS=',' read -ra ids <<< "$SUMMARY"
          for id in "${ids[@]}"; do
            gh run download "$id" -p "time-shard-*" -D "$GITHUB_WORKSPACE/runs/summary-$id"
            files="${files:+$files,}$(find "$GITHUB_WORKSPACE/runs/summary-$id" -name 'time-*.jsonl' | paste -sd, -)"
          done
          pnpm --filter @mark1russell7/highways portfolio:time --summary "$files" --out "$GITHUB_WORKSPACE/portfolio-time-summary.md" > /dev/null
          cat portfolio-time-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Write the report of the router
        if: ${{ env.API != '' }}
        run: |
          set -o pipefail
          dirs() {
            local out=""
            IFS=',' read -ra ids <<< "$1"
            for id in "${ids[@]}"; do
              gh run download "$id" -p "screen-*" -D "$GITHUB_WORKSPACE/runs/$id" >&2
              out="${out:+$out,}$GITHUB_WORKSPACE/runs/$id"
            done
            printf '%s' "$out"
          }
          args=(--records "$(dirs "$API")")
          if [ -n "$POOL" ]; then args+=(--pool "$(dirs "$POOL")"); fi
          pnpm --filter @mark1russell7/highways portfolio:api "${args[@]}" --out "$GITHUB_WORKSPACE/portfolio-api.md" --json "$GITHUB_WORKSPACE/portfolio-api.json" > /dev/null
          cat portfolio-api.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portfolio-fit-${{ github.sha }}
          path: |
            out/
            portfolio-sets.md
            portfolio-api.md
            portfolio-api.json
            portfolio-time-summary.md
            bundle.md
          if-no-files-found: warn
