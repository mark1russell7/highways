# The flip tests of the gate checks (GATE-FLIP): a fault of a stated size turns a check red, and a copy with no fault stays green in the same job.
# `packages/core/scripts/gates/flip.ts` holds the arms. This workflow is not a required check. It tests the required checks.
#
# The workflow starts in three ways:
# - On a dispatch. The input `checks` selects `quick`, `sections` or `all`.
# - Each week on its own minute, because a gate that proves itself only when its code changes misses a drift of the runners and the bench.
# - On a push to main that changes gate code. The job `which` selects the jobs from the changed files:
#   - `quick` reads `scripts/heap.ts`, `scripts/data/heap/`, `scripts/search-work.ts`, `gates/same-stops.ts`, `scripts/screen-verdict.ts` and `search-work.yml`.
#   - `sections` reads `scripts/sections-bisect.ts`, `scripts/sections-gate-verdict.ts`, the time gates of `gates/`, `scripts/data/sections-gate/` and `sections-gate.yml`.
#   - Both read `gates/flip.ts`, `gates/flip-memory.ts` and this file.
#   - A change of the lock file does not start a job, because the release train changes it often. The weekly run reads it.
#
# The job `sections` runs the gate for each arm, 27 to 47 min, and a run that cannot decide takes a second run. So 2 arms take 188 min at the most.
name: Gate flip

on:
  workflow_dispatch:
    inputs:
      checks:
        description: "The flip tests to run: quick, sections or all."
        default: "all"
      rounds:
        description: "The timed rounds of each arm of the sections gate."
        default: "10"
  schedule:
    - cron: "21 3 * * 0"
  push:
    branches: [main]
    paths:
      - "packages/core/scripts/heap.ts"
      - "packages/core/scripts/data/heap/**"
      - "packages/core/scripts/search-work.ts"
      - "packages/core/scripts/screen-verdict.ts"
      - "packages/core/scripts/sections-bisect.ts"
      - "packages/core/scripts/sections-gate-verdict.ts"
      - "packages/core/scripts/gates/**"
      - "packages/core/scripts/data/sections-gate/**"
      - ".github/workflows/search-work.yml"
      - ".github/workflows/sections-gate.yml"
      - ".github/workflows/gate-flip.yml"

permissions:
  contents: read

concurrency:
  # Each commit of main has its own group, so a newer push does not cancel a run that waits (RUNNER-SLOTS).
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  which:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quick: ${{ steps.which.outputs.quick }}
      sections: ${{ steps.which.outputs.sections }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the jobs
        id: which
        env:
          EVENT: ${{ github.event_name }}
          CHECKS: ${{ inputs.checks || 'all' }}
          BEFORE: ${{ github.event.before }}
        run: |
          quick=false
          sections=false
          both='^(packages/core/scripts/gates/flip(-memory)?\.ts|\.github/workflows/gate-flip\.yml)$'
          quickFiles='^(packages/core/scripts/heap\.ts|packages/core/scripts/data/heap/|packages/core/scripts/search-work\.ts|packages/core/scripts/screen-verdict\.ts|packages/core/scripts/gates/same-stops\.ts|\.github/workflows/search-work\.yml)'
          sectionsFiles='^(packages/core/scripts/sections-bisect\.ts|packages/core/scripts/sections-gate-verdict\.ts|packages/core/scripts/gates/(commits|home-verdict|pair-confirm|paired|scope|time-gate)\.ts|packages/core/scripts/data/sections-gate/|\.github/workflows/sections-gate\.yml)'
          if [ "$EVENT" = push ]; then
            # A base that the checkout does not hold starts both jobs, so a push does not skip a flip.
            if changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
              grep -qE "$both|$quickFiles" <<< "$changed" && quick=true
              grep -qE "$both|$sectionsFiles" <<< "$changed" && sections=true
            else
              quick=true
              sections=true
            fi
          else
            case "$CHECKS" in
              quick) quick=true ;;
              sections) sections=true ;;
              all) quick=true; sections=true ;;
              *) echo "The input checks is quick, sections or all, not $CHECKS." >&2; exit 1 ;;
            esac
          fi
          echo "quick=$quick" >> "$GITHUB_OUTPUT"
          echo "sections=$sections" >> "$GITHUB_OUTPUT"

  quick:
    needs: which
    if: needs.which.outputs.quick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The flip of the heap gate
        run: node packages/core/scripts/gates/flip.ts --check heap --out out/gate-flip
      - name: The flip of gate (b) of Search work
        if: ${{ !cancelled() }}
        run: node packages/core/scripts/gates/flip.ts --check work --out out/gate-flip
      - name: The flip of the verdict step of Screen
        if: ${{ !cancelled() }}
        run: node packages/core/scripts/gates/flip.ts --check verdict --out out/gate-flip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-flip-quick
          path: out/gate-flip/

  sections:
    needs: which
    if: needs.which.outputs.sections == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      ROUNDS: ${{ inputs.rounds || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The worktrees of the board, the parent and the fixed base need the history.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The flip of the sections gate
        run: node packages/core/scripts/gates/flip.ts --check sections --out out/gate-flip --trees "$RUNNER_TEMP/trees" --rounds "$ROUNDS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-flip-sections
          path: out/gate-flip/
