# The unit of the work budget of the highway strategy search (SEARCH-BUDGET). It times searchPlan on windows of the dense board
# at several counts of evaluations, and it fits the extra time against the work (edges × evaluations). Times run here, not on a local machine.
name: Search work

on:
  # A pull request that changes search or this script gets the fit with the default inputs.
  pull_request:
    paths:
      - "packages/core/src/highways/search/**"
      - "packages/core/scripts/search-work.ts"
      - ".github/workflows/search-work.yml"
  workflow_dispatch:
    inputs:
      sizes:
        description: "The sizes of the windows of the dense board, in boxes, separated by commas"
        default: "60,125,250,500,1000"
      evaluations:
        description: "The counts of evaluations, separated by commas"
        default: "2,4,8"
      repeat:
        description: "The runs of each point (the time is the median)"
        default: "1"

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SIZES: ${{ inputs.sizes || '60,125,250,500,1000' }}
      EVALUATIONS: ${{ inputs.evaluations || '2,4,8' }}
      REPEAT: ${{ inputs.repeat || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time search against the work
        working-directory: packages/core
        run: |
          set -o pipefail
          node scripts/search-work.ts --sizes "$SIZES" --evaluations "$EVALUATIONS" --repeat "$REPEAT" --out "$RUNNER_TEMP/search-work.jsonl" | tee table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: search-work-${{ github.sha }}
          path: ${{ runner.temp }}/search-work.jsonl
          if-no-files-found: warn
