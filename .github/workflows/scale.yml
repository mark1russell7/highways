# The times of the dense board (ROUTE-SCALE). Each cell of the matrix routes the fixture of packages/core/scripts/data/scale with one router
# and writes the wall time of the route and of each step after it, with `scripts/scale.ts`. With "profile", the cell also keeps a CPU profile
# of one more route and of its steps as an artifact. The job summary joins the rows of the cells.
# The job screen runs the router screen of the base commit and of this commit in turn on one runner, and compares the records and the times.
# Each round of the job screen also runs the base a second time as the A/A arm, so the times have a noise floor (MEASURE-ISOLATE).
# With "sizes", each cell routes boards of `makeFixture` at each size, and then the fixture once, in fresh processes (ROUTER-BUDGET).
# Each round routes each size in the arms a and b, so the times have an A/A ratio. Odd rounds go from the largest size down.
# A route over the limit "cap" stops, and the larger sizes of that round do not start. Its row has `over: true`.
# The note `docs/research/SCALE.md` gives the result.
name: Scale

on:
  workflow_dispatch:
    inputs:
      routers:
        description: "The routers, with commas."
        default: "shared,shared-all,sections,portfolio,corners"
      repeat:
        description: "The number of routes of each router for the times. The first route is cold."
        default: "3"
      profile:
        description: "Also keep a CPU profile of one more route of each router."
        type: boolean
        default: true
      base:
        description: "The base commit of the job screen."
        default: "origin/main"
      rounds:
        description: "The number of rounds of the router screen of each commit in the job screen."
        default: "5"
      sizes:
        description: "Node counts with commas. Each cell then times its router at each size, not the fixture only (ROUTER-BUDGET)."
        default: ""
      size-rounds:
        description: "The number of rounds of the sizes. Each round routes each size in two fresh processes, the arms a and b."
        default: "2"
      cap:
        description: "The time limit of one route of the sizes, in minutes."
        default: "10"
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:

permissions:
  contents: read

concurrency:
  # One run for each ref (RUNNER-SLOTS). A new head of a pull request cancels the old run. A dispatch waits for the run before it.
  group: scale-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          paths: |
            .github/workflows/scale.yml
            packages/core/scripts/scale.ts
            packages/core/scripts/scale-summary.ts
            packages/core/scripts/scale-sizes.ts
            packages/core/scripts/scale-screen.ts
            packages/core/scripts/data/scale/**

  routers:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    env:
      ROUTERS: ${{ inputs.routers || 'shared,shared-all,sections,portfolio,corners' }}
    steps:
      - id: list
        run: echo "list=$(echo "$ROUTERS" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  time:
    if: needs.changes.outputs.match == 'true'
    needs: [changes, routers]
    runs-on: ubuntu-latest
    # The router shared-all took 27 min for two routes of this board on highways 0.7.0. The cell routes it up to four times.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories, and heavy work keeps 28 of them at most. So a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        router: ${{ fromJSON(needs.routers.outputs.list) }}
    env:
      ROUTER: ${{ matrix.router }}
      REPEAT: ${{ inputs.repeat || '3' }}
      PROFILE: ${{ github.event_name == 'pull_request' || inputs.profile }}
      SIZES: ${{ inputs.sizes || '' }}
      SIZE_ROUNDS: ${{ inputs['size-rounds'] || '2' }}
      CAP: ${{ inputs.cap || '10' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time the router
        if: env.SIZES == ''
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd packages/core
          node scripts/scale.ts --router "$ROUTER" --repeat "$REPEAT" --out "$GITHUB_WORKSPACE/out/rows.jsonl" | tee "$GITHUB_WORKSPACE/out/time.log"
      - name: Time the router at each size
        if: env.SIZES != ''
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          rows="$GITHUB_WORKSPACE/out/rows.jsonl"
          cd packages/core
          IFS=, read -ra up <<< "$SIZES"
          down=(); for (( i=${#up[@]}-1; i>=0; i-- )); do down+=("${up[i]}"); done
          # This function routes one board in a fresh process. A route over the limit gives a row with `over: true`, and the function gives 1.
          # FAIL-CLOSED: another failure of the process stops the job.
          route() {
            local nodes=$1 round=$2 arm=$3 st=0; shift 3
            timeout "${CAP}m" node scripts/scale.ts --router "$ROUTER" --route-only --round "$round" --arm "$arm" --out "$rows" "$@" | tee -a "$GITHUB_WORKSPACE/out/time.log" || st=$?
            if [ "$st" = 0 ]; then return 0; fi
            if [ "$st" != 124 ]; then echo "The route of $ROUTER at $nodes nodes failed with the code $st."; exit "$st"; fi
            jq -nc --arg r "$ROUTER" --argjson n "$nodes" --argjson round "$round" --arg arm "$arm" --argjson cap "$CAP" '{router: $r, nodes: $n, round: $round, arm: $arm, over: true, capMinutes: $cap}' >> "$rows"
            return 1
          }
          for (( round=0; round<SIZE_ROUNDS; round++ )); do
            if (( round % 2 == 0 )); then list=("${up[@]}"); else list=("${down[@]}"); fi
            stop=
            for n in "${list[@]}"; do
              n=$(echo "$n" | tr -d ' ')
              # After a route over the limit, a larger size of this round is over the limit too, so it does not start.
              if [ -n "$stop" ] && (( n > stop )); then continue; fi
              for arm in a b; do
                route "$n" "$round" "$arm" --nodes "$n" || { stop=$n; break; }
              done
            done
          done
          route 1000 0 fixture || true
          # A route over the limit is a "no read" of its size, so the check line names each one (NO-READ-LINE).
          over=$(jq -s '[.[] | select(.over == true)] | length' "$rows")
          if [ "$over" -gt 0 ]; then
            cases=$(jq -rs '[.[] | select(.over == true) | "\(.nodes) nodes in round \(.round), arm \(.arm)"] | join(", ")' "$rows")
            cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
            echo "::warning title=Scale ${ROUTER}::No read of ${over} routes: each one went over the limit of ${CAP} min. The cases: ${cases}. The CPU model: ${cpu}."
          fi
      - name: Profile one more route
        if: env.PROFILE == 'true' && env.SIZES == ''
        run: |
          set -o pipefail
          cd packages/core
          node scripts/scale.ts --router "$ROUTER" --profile "$GITHUB_WORKSPACE/out/$ROUTER.cpuprofile" | tee "$GITHUB_WORKSPACE/out/profile.md"
          { echo "## The profile of $ROUTER"; echo; sed -n '/^| self/,/^$/p' "$GITHUB_WORKSPACE/out/profile.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scale-${{ matrix.router }}
          path: out/
          if-no-files-found: warn

  summary:
    needs: [changes, routers, time]
    if: ${{ needs.changes.outputs.match == 'true' && (!cancelled()) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.sizes != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The summary of the sizes imports the statistics package, so it needs the install.
      - if: inputs.sizes != ''
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scale-*
          path: cells
      # FAIL-CLOSED: each router of the matrix gives its rows.
      - name: Check the inputs of the summary
        env:
          ROUTERS: ${{ needs.routers.outputs.list }}
        run: |
          got=$(find cells -name rows.jsonl | sed -E 's#^cells/scale-([^/]+)/rows\.jsonl$#\1#' | paste -sd, -)
          # With one cell, the action puts the files of the artifact in cells/ itself, with no folder of the artifact (FIT-COST).
          if [ "$got" = "cells/rows.jsonl" ] && [ "$(jq length <<< "$ROUTERS")" = 1 ]; then got=$(jq -r '.[0]' <<< "$ROUTERS"); fi
          node packages/core/scripts/gates/inputs.ts "scale cells" --expect "$(jq -r 'join(",")' <<< "$ROUTERS")" --got "$got"
      - name: Write the summary
        env:
          SIZES: ${{ inputs.sizes || '' }}
        run: |
          find cells -name rows.jsonl | sort | xargs cat > rows.jsonl
          if [ -n "$SIZES" ]; then node packages/core/scripts/scale-sizes.ts rows.jsonl > scale.md; else node packages/core/scripts/scale-summary.ts rows.jsonl > scale.md; fi
          cat scale.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scale-summary
          path: |
            scale.md
            rows.jsonl

  screen:
    needs: changes
    # A run of the sizes times the routers only, so it does not start the screen.
    if: needs.changes.outputs.match == 'true' && (inputs.sizes || '') == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ inputs.base || 'origin/main' }}
      ROUNDS: ${{ inputs.rounds || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the router screen of the two commits in turn
        run: |
          set -o pipefail
          # The base uses the packages of this commit. The lockfile of the two commits must give the same packages.
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          ln -s "$GITHUB_WORKSPACE/packages/core/node_modules" "$RUNNER_TEMP/base/packages/core/node_modules"
          mkdir -p out
          # Each round runs three arms, each in its own process: the base, the head and the A/A arm (the base again).
          # The order of the arms turns by one in each round, so no arm is always first (MEASURE-ISOLATE).
          arm() {
            if [ "$1" = head ]; then dir=packages/core; else dir="$RUNNER_TEMP/base/packages/core"; fi
            (cd "$dir" && node scripts/screen.ts --step router --out "$GITHUB_WORKSPACE/out/$1-$2.jsonl" --summary "$GITHUB_WORKSPACE/out/$1-$2.md")
          }
          arms=(base head aa)
          for i in $(seq 1 "$ROUNDS"); do
            for j in 0 1 2; do arm "${arms[$(( (i - 1 + j) % 3 ))]}" "$i"; done
          done
          node packages/core/scripts/scale-screen.ts out/base-*.jsonl -- out/head-*.jsonl -- out/aa-*.jsonl --json out/screen-paired.json | tee out/screen.md
          { echo "Base: $(git rev-parse --short "$BASE"). Head: $(git rev-parse --short HEAD)."; echo; cat out/screen.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scale-screen
          path: out/
          if-no-files-found: warn

  scale-ok:
    name: Scale OK
    if: ${{ !cancelled() }}
    needs: [changes, routers, time, summary, screen]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          needs: ${{ toJSON(needs) }}
          # A run of the sizes skips the job screen on purpose.
          allow-skip: ${{ inputs.sizes != '' && 'summary screen' || 'summary' }}
