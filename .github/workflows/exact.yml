# The exact solves of MEAS2: fixed-charge network design (HWY-040), solved with HiGHS on small boards.
# The mode `ladder` solves boards of each size, to find the largest size with a proven optimum within the time limit.
# The mode `set` solves each input of a screen set, for example `exact-v1`, and gives the file of the optima as an artifact.
# The solves run in shards of a matrix. The last job joins the lines of the shards and writes a summary.
name: Exact

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ladder or set."
        default: "ladder"
      set:
        description: "The screen set of the mode set."
        default: "exact-v1"
      sizes:
        description: "The node counts of the mode ladder, with commas."
        default: "10,14,18,24,30,40"
      classes:
        description: "The board classes of the mode ladder, with commas. Empty: each class."
        default: ""
      seeds:
        description: "The seeds of the mode ladder, with commas."
        default: "0,1,2"
      caps:
        description: "The stretch caps, with commas."
        default: "1.1,1.25,1.5"
      rules:
        description: "The rules of the model, with commas: collection, all."
        default: "collection,all"
      seconds:
        description: "The time limit of each solve, in seconds."
        default: "300"
      shards:
        description: "The number of shards of the matrix."
        default: "20"
      minutes:
        description: "The time limit of each shard, in minutes."
        default: "120"

permissions:
  contents: read

concurrency:
  group: exact-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.set }}-${{ inputs.sizes }}-${{ inputs.caps }}-${{ inputs.rules }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards || '20' }}
        run: echo "shards=$(seq -s, 0 $((SHARDS - 1)) | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  solve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.minutes || '120') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      MODE: ${{ inputs.mode || 'ladder' }}
      SET: ${{ inputs.set || 'exact-v1' }}
      SIZES: ${{ inputs.sizes || '10,14,18,24,30,40' }}
      CLASSES: ${{ inputs.classes || '' }}
      SEEDS: ${{ inputs.seeds || '0,1,2' }}
      CAPS: ${{ inputs.caps || '1.1,1.25,1.5' }}
      RULES: ${{ inputs.rules || 'collection,all' }}
      SECONDS_EACH: ${{ inputs.seconds || '300' }}
      SHARDS: ${{ inputs.shards || '20' }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Solve the shard
        run: |
          set -o pipefail
          args=(--caps "$CAPS" --rules "$RULES" --seconds "$SECONDS_EACH" --shard "$SHARD/$SHARDS" --out "$GITHUB_WORKSPACE/exact-$SHARD.jsonl")
          if [ "$MODE" = "ladder" ]; then
            args+=(--ladder --sizes "$SIZES" --seeds "$SEEDS")
            [ -n "$CLASSES" ] && args+=(--classes "$CLASSES")
          else
            args+=(--set "$SET")
          fi
          pnpm --filter @mark1russell7/highways exact "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-shard-${{ matrix.shard }}
          path: exact-${{ matrix.shard }}.jsonl
          if-no-files-found: warn

  merge:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || 'ladder' }}
      SET: ${{ inputs.set || 'exact-v1' }}
      SECONDS_EACH: ${{ inputs.seconds || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: exact-shard-*
          path: shards
      - name: Join the shards
        run: |
          set -o pipefail
          name="optima-$SET.json"
          [ "$MODE" = "ladder" ] && name="ladder.json"
          pnpm --filter @mark1russell7/highways exact --merge "$GITHUB_WORKSPACE/shards" --set "$SET" --seconds "$SECONDS_EACH" --out "$GITHUB_WORKSPACE/$name" --summary "$GITHUB_WORKSPACE/exact.md"
          cat exact.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-${{ inputs.mode || 'ladder' }}-${{ github.sha }}
          path: |
            ladder.json
            optima-*.json
            exact.md
          if-no-files-found: warn
