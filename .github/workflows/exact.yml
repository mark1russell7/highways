# The exact solves of MEAS2: fixed-charge network design (HWY-040), solved with HiGHS on small boards.
# `args` are the arguments of `pnpm exact` (packages/core/scripts/exact.ts), without --shard and --out. For example:
#   --ladder --sizes 10,14,18,24,30,40 --seeds 0,1,2 --caps 1.5 --seconds 300 --shards 36
#   --set exact-v1 --caps 1.1,1.25,1.5 --rules collection,all --seconds 300 --shards 40
# The solves run in shards of a matrix (--shards, default 20). The last job joins the lines of the shards, writes a summary
# and gives the file of the optima (or of the ladder) as an artifact. The workflow `Screen` calls this workflow with its input `exact`.
name: Exact

on:
  workflow_call:
    inputs:
      args:
        type: string
        required: true
      minutes:
        type: string
        default: "120"
  workflow_dispatch:
    inputs:
      args:
        description: "The arguments of pnpm exact, without --shard and --out."
        default: "--ladder --sizes 10,14,18 --caps 1.5 --seconds 300 --shards 20"
      minutes:
        description: "The time limit of each shard, in minutes."
        default: "120"

permissions:
  contents: read

concurrency:
  # One run for each ref (RUNNER-SLOTS). A dispatch waits for the run before it.
  group: exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - id: plan
        env:
          ARGS: ${{ inputs.args }}
        run: |
          n=$(printf '%s' "$ARGS" | sed -n 's/.*--shards \([0-9][0-9]*\).*/\1/p')
          n=${n:-20}
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((n - 1)))]" >> "$GITHUB_OUTPUT"

  solve:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.minutes || '120') }}
    strategy:
      fail-fast: false
      # The account runs at most 40 jobs at one time across all repositories, and heavy work keeps 28 of them at most. So a heavy matrix runs 3 cells at most (RUNNER-SLOTS).
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      ARGS: ${{ inputs.args }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Solve the shard
        run: |
          set -o pipefail
          read -ra args <<< "$ARGS"
          pnpm --filter @mark1russell7/highways exact "${args[@]}" --shard "$SHARD/$SHARDS" --out "$GITHUB_WORKSPACE/exact-$SHARD.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-shard-${{ matrix.shard }}
          path: exact-${{ matrix.shard }}.jsonl
          if-no-files-found: warn

  merge:
    needs: [plan, solve]
    if: always()
    runs-on: ubuntu-latest
    env:
      ARGS: ${{ inputs.args }}
      # The join expects the file of each shard of the plan (FAIL-CLOSED).
      SHARDS: ${{ needs.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: exact-shard-*
          path: shards
      - name: Join the shards
        run: |
          set -o pipefail
          read -ra args <<< "$ARGS"
          pnpm --filter @mark1russell7/highways exact --shards "$SHARDS" "${args[@]}" --merge "$GITHUB_WORKSPACE/shards" --out "$GITHUB_WORKSPACE/optima.json" --summary "$GITHUB_WORKSPACE/exact.md"
          cat exact.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: exact-${{ github.sha }}
          path: |
            optima.json
            exact.md
          if-no-files-found: warn
