# This workflow writes one record of `packages/core/scripts` in one normal CI job, and it keeps the record as an artifact.
# A record that takes minutes of memory runs here, so that it leaves a run and it does not wait for a lease on a shared machine.
# The summary states the real time of the job. The record goes into the branch by a commit of its owner.
name: Records

on:
  workflow_dispatch:
    inputs:
      record:
        description: "The script that writes the record"
        type: choice
        default: control-wins
        options:
          - control-wins
          - through-floor
          - through-check
          - paint-tie
          - joint-win

permissions:
  contents: read

concurrency:
  # One run for each record and ref (RUNNER-SLOTS).
  group: ${{ github.workflow }}-${{ inputs.record }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  record:
    runs-on: ubuntu-latest
    # The slowest record, `paint-tie`, took 23 min on a shared machine. The limit is 2 times that, and more for the install.
    timeout-minutes: 60
    env:
      RECORD: ${{ inputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write the record
        run: |
          set -o pipefail
          SECONDS=0
          node "packages/core/scripts/$RECORD.ts" "out/$RECORD/record.json"
          { echo "## Record $RECORD"; echo; echo "The script took $SECONDS s on $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ inputs.record }}
          path: out/${{ inputs.record }}/record.json
          if-no-files-found: error
